<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mod-Guide</title>
<style>
  :root {
    --panel: #1f2c44; --panel-2: #26354f; --line: rgba(255,255,255,.14);
    --text: #f2f4f8; --muted: #9aa6bb; --bubble: #e9edf4; --bubble-ink: #1b2538;
    --on: #f2f4f8; --on-ink: #1f2c44; --accent: #7fb0e6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #eef1f6; color: #1b2538;
    font-family: system-ui, -apple-system, "Noto Sans Bengali", "Kalpurush", sans-serif;
    display: flex; justify-content: center; padding: 40px 16px; line-height: 1.5;
  }
  .app {
    width: 100%; max-width: 760px; background: var(--panel); color: var(--text);
    border-radius: 18px; padding: 22px; box-shadow: 0 10px 30px rgba(20,30,50,.25);
  }
  h1 { font-size: 1.3rem; margin: 0; font-weight: 600; }
  .intro { color: var(--muted); font-size: .9rem; margin: 6px 0 16px; }
  .thread { min-height: 120px; display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--muted); font-size: .92rem; padding: 26px 4px; text-align: center; }
  .msg-user { display: flex; gap: 10px; align-items: flex-start; }
  .avatar {
    flex: 0 0 30px; height: 30px; border-radius: 50%; background: var(--panel-2);
    display: grid; place-items: center; font-size: .75rem; color: var(--muted); border: 1px solid var(--line);
  }
  .bubble {
    background: var(--bubble); color: var(--bubble-ink); border-radius: 14px;
    padding: 12px 14px; font-size: 1rem; white-space: pre-wrap; max-width: 90%;
  }
  .match {
    margin-left: 40px; border: 1px solid var(--line); background: var(--panel-2);
    border-radius: 10px; padding: 12px 14px; font-size: .95rem;
  }
  .match .tag { color: var(--accent); font-size: .75rem; margin-right: 8px; }
  .match .label { color: var(--muted); }
  .match .expl { margin-top: 6px; white-space: pre-wrap; }
  .note { color: var(--muted); font-size: .9rem; margin-left: 40px; }
  .err { color: #ffb4b4; margin-left: 40px; }
  .composer {
    margin-top: 14px; display: flex; gap: 10px; align-items: flex-end;
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px;
  }
  textarea {
    flex: 1; min-height: 56px; max-height: 220px; resize: vertical; border: 0; outline: none;
    background: transparent; color: var(--text); font: inherit; font-size: 1rem; padding: 6px;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    flex: 0 0 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--on); color: var(--on-ink); font-size: 1.1rem; display: grid; place-items: center;
  }
  .send:disabled { opacity: .45; cursor: default; }
  .foot { color: var(--muted); font-size: .8rem; margin-top: 12px; }
  .loader { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 16px; font-size: .95rem; }
  .loader input[type=file] { color: var(--text); margin-top: 8px; }
  .loader .err { margin: 10px 0 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
</head>
<body>
<div id="root"></div>

<script>
const h = React.createElement;
const { useState, useEffect, useMemo } = React;

const MIN_SCORE = 0.05;   // below this, the match is treated as "no close example"
const TOP_K = 2;

// Character n-gram TF-IDF (2-4 grams, sublinear tf), computed in the browser.
function grams(text) {
  const t = " " + text.toLowerCase().replace(/\s+/g, " ").trim() + " ";
  const counts = new Map();
  for (let n = 2; n <= 4; n++) {
    for (let i = 0; i + n <= t.length; i++) {
      const g = t.substr(i, n);
      counts.set(g, (counts.get(g) || 0) + 1);
    }
  }
  return counts;
}

function buildIndex(corpus) {
  const docs = corpus.map(e => grams(e.speech + "\n" + e.explanation));
  const df = new Map();
  for (const d of docs) for (const g of d.keys()) df.set(g, (df.get(g) || 0) + 1);
  const N = docs.length;

  function vectorize(counts) {
    const v = new Map();
    let norm = 0;
    for (const [g, c] of counts) {
      const idf = Math.log((1 + N) / (1 + (df.get(g) || 0))) + 1;
      const w = (1 + Math.log(c)) * idf;
      v.set(g, w);
      norm += w * w;
    }
    norm = Math.sqrt(norm) || 1;
    for (const [g, w] of v) v.set(g, w / norm);
    return v;
  }

  const docVecs = docs.map(vectorize);

  function search(query) {
    const q = vectorize(grams(query));
    const scored = docVecs.map((dv, i) => {
      let s = 0;
      for (const [g, w] of q) { const x = dv.get(g); if (x) s += w * x; }
      return { i, s };
    });
    scored.sort((a, b) => b.s - a.s);
    return scored.slice(0, TOP_K).filter(r => r.s >= MIN_SCORE);
  }

  return { search, N };
}

function Match({ entry, score }) {
  return h("div", { className: "match" },
    h("span", { className: "tag" }, entry.community),
    entry.theme ? h("span", { className: "tag" }, entry.theme) : null,
    h("span", { className: "tag" }, "match " + score.toFixed(2)),
    h("div", null, h("span", { className: "label" }, "Similar example: "), entry.speech),
    h("div", { className: "expl" }, h("span", { className: "label" }, "Community explanation:"), "\n" + entry.explanation)
  );
}

function App() {
  const [corpus, setCorpus] = useState(null);
  const [loadError, setLoadError] = useState(null);
  const [text, setText] = useState("");
  const [result, setResult] = useState(null);

  // Local server: load the corpus from this app's /api/corpus. If that fails,
  // the viewer can still choose a corpus.json file.
  useEffect(() => {
    fetch("/api/corpus")
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(setCorpus)
      .catch(e => setLoadError("could not reach /api/corpus (" + e.message + ")"));
  }, []);

  // The corpus is read from a file the viewer chooses. It stays in their browser
  // and is never uploaded or stored by this page.
  function onFile(e) {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    f.text()
      .then(t => {
        const data = JSON.parse(t);
        if (!Array.isArray(data) || !data.every(x => x && typeof x.speech === "string" && typeof x.explanation === "string")) {
          throw new Error("the file is not a corpus list (expected records with speech and explanation)");
        }
        setLoadError(null);
        setCorpus(data);
      })
      .catch(err => setLoadError(err.message));
  }

  const index = useMemo(() => (corpus ? buildIndex(corpus) : null), [corpus]);

  function check() {
    const t = text.trim();
    if (!t || !index) return;
    const hits = index.search(t).map(r => ({ entry: corpus[r.i], score: r.s }));
    setResult({ text: t, hits });
  }

  const onKey = (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); check(); }
  };

  let body;
  if (!corpus) {
    body = h("div", { className: "loader" },
      h("p", null, "To begin, choose the corpus file (corpus.json) from your computer. It is read in your browser only and is not uploaded."),
      h("input", { type: "file", accept: ".json,application/json", onChange: onFile }),
      loadError ? h("p", { className: "err" }, "Could not load the file: " + loadError) : null
    );
  } else if (!result) {
    body = h("div", { className: "empty" }, "Paste a post or comment below and press send.");
  } else {
    body = [
      h("div", { key: "u", className: "msg-user" },
        h("div", { className: "avatar" }, "you"),
        h("div", { className: "bubble" }, result.text)),
      result.hits.length === 0
        ? h("div", { key: "n", className: "note" },
            "No close example was found in the corpus for this text. That does not mean the text is acceptable. It only means nothing similar is recorded here.")
        : result.hits.map((hit, i) => h(Match, { key: "m" + i, entry: hit.entry, score: hit.score }))
    ];
  }

  return h("div", { className: "app" },
    h("h1", null, "Mod-Guide"),
    h("p", { className: "intro" },
      "Paste a comment to see the closest examples from the community-written corpus, with the explanations members gave for why such speech is insensitive toward Hindu and Chakma communities. This version makes no AI calls."),
    h("div", { className: "thread" }, body),
    h("div", { className: "composer" },
      h("textarea", {
        value: text,
        placeholder: "Paste a post or comment here (Bengali or English).",
        onChange: e => setText(e.target.value),
        onKeyDown: onKey
      }),
      h("button", {
        className: "send", title: "Check", "aria-label": "Check",
        disabled: !index, onClick: check
      }, "➤")
    ),
    h("div", { className: "foot" },
      index ? "Corpus: " + index.N + " annotated examples. No AI calls are made." : "Corpus not loaded yet.")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
